<!doctype html>
<html lang="en" dir="ltr">
	<head>
		<title>Video Speed Regulator</title>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="./styles/popup.css" />
		<script type="module" src="./js/popup.js"></script>
	</head>

	<body>
		<ui5-text id="no-videos" class="no-videos" hidden>No videos found on this page</ui5-text>
		<div id="slider-container" class="slider-container" hidden>
			<ui5-slider id="slider" value="1" accessible-name="Playback speed"></ui5-slider>
			<div id="tooltip" popover="manual"></div>
		</div>
	</body>
</html>
