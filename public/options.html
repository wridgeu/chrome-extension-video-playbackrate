<!doctype html>
<html lang="en" dir="ltr">
	<head>
		<title>Video Speed Regulator Settings</title>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="./styles/options.css" />
		<script type="module" src="./js/options.js"></script>
	</head>

	<body>
		<ui5-message-strip id="saveError" design="Negative" hide-close-button hidden></ui5-message-strip>
		<ui5-form layout="S1 M1 L1 XL1" label-span="S12 M12 L12 XL12">
			<ui5-form-group header-text="Playback">
				<ui5-form-item>
					<ui5-label slot="labelContent" for="defaultSpeed">Default speed for new videos</ui5-label>
					<!-- Options are generated from the shared speed list in options.ts -->
					<ui5-select id="defaultSpeed"></ui5-select>
				</ui5-form-item>
			</ui5-form-group>
			<ui5-form-group header-text="Appearance">
				<ui5-form-item>
					<ui5-label slot="labelContent" for="badgeToggle">Show speed on toolbar icon</ui5-label>
					<ui5-switch id="badgeToggle" design="Graphical"></ui5-switch>
				</ui5-form-item>
				<ui5-form-item>
					<ui5-label slot="labelContent" id="themeLabel">Theme</ui5-label>
					<ui5-segmented-button id="themeMode" accessible-name-ref="themeLabel">
						<ui5-segmented-button-item data-mode="system">System</ui5-segmented-button-item>
						<ui5-segmented-button-item data-mode="light">Light</ui5-segmented-button-item>
						<ui5-segmented-button-item data-mode="dark">Dark</ui5-segmented-button-item>
					</ui5-segmented-button>
				</ui5-form-item>
			</ui5-form-group>
		</ui5-form>
	</body>
</html>
